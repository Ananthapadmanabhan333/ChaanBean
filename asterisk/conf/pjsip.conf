[global]
type = global
; Reject unknown peers outright rather than answering with a 401 that confirms
; the extension exists. Scanners enumerate; this makes enumeration useless.
;
; NOTE: alwaysauthreject is chan_sip terminology. PJSIP achieves the same by
; never auto-creating endpoints and by the transport ACL below.
user_agent = crp

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
; --- The classic one-way-audio causes, set now rather than debugged later.
; On a cloud VM Asterisk sees only the private IP and advertises it in SDP
; unless told otherwise, which produces a call that connects and plays silence.
; external_media_address = <public ip>
; external_signaling_address = <public ip>
local_net = 10.0.0.0/8
local_net = 172.16.0.0/12
local_net = 192.168.0.0/16
local_net = 127.0.0.0/8

; ---------------------------------------------------------------- local test
; The fake callee. Register a softphone (Zoiper, Linphone) as local-test to
; hear a real call end to end with no carrier.
[local-test]
type = endpoint
context = crp-inbound
; Pin the codec. Indian PSTN negotiates G.711 A-law, and staging an .alaw copy
; beside the .sln means Asterisk picks the zero-transcode match.
disallow = all
allow = alaw
auth = local-test-auth
aors = local-test
; Without this Asterisk drops out of the media path and cannot play audio at all.
direct_media = no

[local-test-auth]
type = auth
auth_type = userpass
username = local-test
password = local-test

[local-test]
type = aor
max_contacts = 2
remove_existing = yes

; ------------------------------------------------------------ carrier trunk
