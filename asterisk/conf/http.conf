[general]
enabled = yes

; Bound to all interfaces *inside the container*, and exposed only to the host's
; loopback by the port publish (`-p 127.0.0.1:8088:8088`). Binding to 127.0.0.1
; here would mean the container's own loopback, which nothing outside the
; container can reach — including the application.
;
; The guarantee is unchanged: ARI is not reachable from the network. ARI
; credentials are unrestricted call-origination authority, and an
; internet-reachable ARI is toll fraud waiting to happen. Verify with
; `docker port crp-asterisk` — the mapping must read 127.0.0.1, not 0.0.0.0.
;
; On a bare-metal host, use bindaddr = 127.0.0.1 instead.
bindaddr = 0.0.0.0
bindport = 8088
