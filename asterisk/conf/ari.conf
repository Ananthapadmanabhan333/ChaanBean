; ARI credentials are unrestricted call-origination authority. An
; internet-reachable ARI is toll fraud waiting to happen, so the HTTP listener
; below binds to loopback only (see http.conf) and this file never grants more
; than one user.
[general]
enabled = yes
pretty = yes
allowed_origins = http://localhost

[crp]
type = user
read_only = no
; Overridden by ARI_PASSWORD at deploy time. Never ship this value.
password = crp
password_format = plain
