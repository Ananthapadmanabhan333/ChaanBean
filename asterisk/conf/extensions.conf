[general]
static = yes
writeprotect = yes

[globals]
CRP_APP = crp-outbound

; Every originated channel lands here and is handed to the application. All call
; control lives in Python; the dialplan deliberately decides nothing.
[crp-outbound]
exten => _X.,1,NoOp(CRP outbound to ${EXTEN})
 same => n,Stasis(${CRP_APP},${CHANNEL(uniqueid)})
 same => n,Hangup()

[crp-inbound]
exten => _X.,1,NoOp(CRP inbound from ${CALLERID(num)})
 same => n,Answer()
 same => n,Stasis(${CRP_APP})
 same => n,Hangup()

; A loopback callee for local testing: answers, waits, then hangs up with a
; configurable Q.850 cause so the never-answered and busy paths can be exercised
; without a carrier.
;   Originate to Local/ringout@crp-test  -> no answer
;   Originate to Local/busy@crp-test     -> cause 17
[crp-test]
exten => answer,1,Answer()
 same => n,Wait(30)
 same => n,Hangup(16)

exten => ringout,1,Wait(20)
 same => n,Hangup(19)

exten => busy,1,Busy(5)
 same => n,Hangup(17)

exten => congestion,1,Congestion(5)
 same => n,Hangup(34)
