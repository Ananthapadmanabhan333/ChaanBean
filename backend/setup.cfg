# Module boundaries, enforced. A boundary that is only a convention stops being a
# boundary in week three, so CI fails on it now — while there are few modules to
# fix rather than twelve.
#
#   lint-imports
#
[importlinter]
root_package = app
include_external_packages = True

[importlinter:contract:layers]
name = Domain modules are layered
type = layers
# Parenthesised layers are optional — they arrive in later phases and the
# contract should not fail merely because one does not exist yet.
# Highest first. `app.telephony` sits ABOVE `app.calls`: telephony/flow.py is
# the call-orchestration layer and legitimately drives call state, while the ARI
# transport underneath it depends on nothing. The dependency is one-way and
# acyclic — app.calls imports nothing from app.telephony.
#
# `app.company` sits directly under the API and above everything else. Deciding
# that two names are one legal entity is driven by a request and by a person
# reviewing the result; putting it here means nothing lower can reach up into
# it, so no scheduler tick and no import run can quietly resolve a company on
# its own. It stays above app.models, which is all it needs from below.
#
# `app.legal` sits ABOVE `app.company`, which is the one place the ordering is
# not obvious. Attributing a court case needs the resolved entity — cases.py
# asks app.company which identifiers the registry actually holds — so company
# has to be underneath it. The same rule as company then applies one level up:
# nothing lower can reach into app.legal, so no tick and no import run can
# attach litigation to a debtor on its own.
#
# `app.intelligence` sits low, just above app.models, because that is genuinely
# all it reads. Promises and payment behaviour are derived from the ledger's
# rows and from nothing else; keeping the layer where its dependencies are means
# a future import of app.policy or app.scheduler from a scoring module fails
# here rather than in review.
#
# `app.providers` is deliberately absent. It is governed by its own forbidden
# contract below, and it could not be placed here honestly: providers/courts.py
# imports app.company.resolution for the suffix-stripping tokeniser, which any
# position under app.company would forbid. The forbidden contract is the
# boundary that matters for providers — no reaching into the domain's decisions
# — and it does not list app.company.
layers =
    (app.api)
    (app.analytics)
    (app.legal)
    (app.company)
    (app.scheduler)
    (app.telephony)
    (app.calls)
    (app.comms)
    (app.ingestion)
    (app.render)
    (app.tts)
    (app.storage)
    (app.policy)
    (app.registry)
    (app.trade)
    (app.intelligence)
    (app.identity)
    (app.models)
ignore_imports =
    app.identity.api_keys -> app.identity.auth

[importlinter:contract:providers]
name = Providers depend on nothing in the domain
type = forbidden
source_modules =
    app.providers
forbidden_modules =
    app.api
    app.calls
    app.comms
    app.policy
    app.scheduler
    app.telephony
    app.trade
allow_indirect_imports = true

[importlinter:contract:policy-purity]
name = The Policy Engine touches no I/O
type = forbidden
source_modules =
    app.policy
forbidden_modules =
    app.db
    app.providers
    sqlalchemy
    httpx
    boto3
    redis
# Direct imports only. `app.policy` imports the shared enums from `app.models`,
# which is itself a SQLAlchemy module — that hop is legitimate and expected. What
# this forbids is the engine reaching for a session or a vendor client itself.
allow_indirect_imports = true
