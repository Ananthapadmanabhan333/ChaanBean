# Alembic. Introduced now that the schema has settled and the tables carry
# customer data — at that point `create_all` stops being honest.
#
#   alembic revision --autogenerate -m "what changed"
#   alembic upgrade head
#
# Migrations run as the OWNER (DATABASE_URL_ADMIN), not as the application role.
# crp_app deliberately cannot alter schema.
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
